name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装 Python 测试依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 运行 Python 单元测试
        run: python -m unittest discover -s tests -v

  windows-pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装 Windows Python 测试依赖
        run: python -m pip install -r requirements-dev.txt -r requirements-windows.txt
      - name: 运行 Windows Python 测试
        # 逐用例输出并在单个测试超过 120 秒时记录线程栈；不跳过任何测试。
        run: python -m pytest -vv -o faulthandler_timeout=120 tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json
      - name: 校验 Node/npm 工具链
        run: |
          test "$(node --version)" = "v22.22.0"
          test "$(npm --version)" = "10.9.4"
      - name: 校验 lockfile registry
        run: |
          if grep -n '"resolved": "https://' package-lock.json | grep -v 'https://registry.npmjs.org/'; then
            echo "package-lock.json 包含非官方 registry 地址" >&2
            exit 1
          fi
      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json
      - name: 校验 Node/npm 工具链
        run: |
          test "$(node --version)" = "v22.22.0"
          test "$(npm --version)" = "10.9.4"
      - run: python -m pip install -r requirements-dev.txt
      - name: 安装许可证检查依赖
        run: npm --prefix dashboard-web ci --no-audit --no-fund
      - run: python scripts/check_licenses.py
      - run: node scripts/check_licenses.mjs

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 仓库秘密扫描（输出脱敏）
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source=/repo --redact --no-banner
      - name: 文件名级秘密模式复核
        run: python3 scripts/scan_secrets.py

  macos-app:
    runs-on: macos-15
    needs: [python-tests, frontend, licenses, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json
      - name: 校验 Node/npm 工具链
        run: |
          test "$(node --version)" = "v22.22.0"
          test "$(npm --version)" = "10.9.4"
      - name: 构建并验证未签名 .app
        run: scripts/build_macos_app.sh
      - name: 原生运行 2.0 安装包前端与桥接
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from prepare_release_evidence import frontend_startup_gate
          bundle = Path("dist/SJTU Learning Assistant.app")
          _, report = frontend_startup_gate(bundle / "Contents/MacOS/SJTU Learning Assistant", bundle, "macos")
          print("2.0 packaged WKWebView and bridge:", report["result"])
          PY
      - name: 打包 artifact（不签名、不公证）
        run: ditto -c -k --sequesterRsrc --keepParent "dist/SJTU Learning Assistant.app" "dist/SJTU-Learning-Assistant-macOS-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SJTU-Learning-Assistant-macOS-unsigned
          path: dist/SJTU-Learning-Assistant-macOS-unsigned.zip
          if-no-files-found: error


  windows-app:
    runs-on: windows-latest
    needs: [python-tests, frontend, licenses, secret-scan]
    steps:
      - name: Preserve source and recipe bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json
      - name: 校验 Node/npm 工具链
        shell: bash
        run: |
          test "$(node --version)" = "v22.22.0"
          test "$(npm --version)" = "10.9.4"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make
      - name: Set source-build MSYS2 Bash path
        shell: msys2 {0}
        run: |
          printf 'SJTU_MSYS2_BASH=%s\n' "$(cygpath -w /usr/bin/bash.exe)" >> "$GITHUB_ENV"
      - name: 安装 Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: 构建 Windows portable 与安装器
        shell: pwsh
        run: scripts/build_windows_app.ps1
      - name: 原生运行 2.0 安装包前端与桥接
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from prepare_release_evidence import frontend_startup_gate
          bundle = Path("dist/SJTU Learning Assistant")
          _, report = frontend_startup_gate(bundle / "SJTU Learning Assistant.exe", bundle, "windows")
          print("2.0 packaged EdgeChromium and bridge:", report["result"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SJTU-Learning-Assistant-Windows-x64
          path: |
            dist/SJTU-Learning-Assistant-*-Windows-x64-portable.zip
            dist/SJTU-Learning-Assistant-*-Windows-x64-portable.zip.sha256
            dist/SJTU-Learning-Assistant-*-Windows-x64-Setup.exe
            dist/SJTU-Learning-Assistant-*-Windows-x64-Setup.exe.sha256
          if-no-files-found: error
