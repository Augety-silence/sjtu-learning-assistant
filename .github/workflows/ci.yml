name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装 Python 运行依赖
        run: python -m pip install -r requirements.txt
      - name: 运行 Python 单元测试
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm --prefix dashboard-web ci
      - run: python scripts/check_licenses.py
      - run: node scripts/check_licenses.mjs

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 仓库秘密扫描（输出脱敏）
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source=/repo --redact --no-banner
      - name: 文件名级秘密模式复核
        run: python3 scripts/scan_secrets.py

  macos-app:
    runs-on: macos-14
    needs: [python-tests, frontend, licenses, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json
      - name: 构建并验证未签名 .app
        run: scripts/build_macos_app.sh
      - name: 打包 artifact（不签名、不公证）
        run: ditto -c -k --sequesterRsrc --keepParent "dist/SJTU Learning Assistant.app" "dist/SJTU-Learning-Assistant-macOS-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SJTU-Learning-Assistant-macOS-unsigned
          path: dist/SJTU-Learning-Assistant-macOS-unsigned.zip
          if-no-files-found: error
