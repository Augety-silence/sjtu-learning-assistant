name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (for example v1.8.21)
        required: true
        type: string
      use_local_macos:
        description: Legacy input; must be false. Both native CI builds are required.
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      use_local_macos: ${{ steps.identity.outputs.use_local_macos }}
      eligible: ${{ steps.draft.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve and validate exact immutable tag commit
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          USE_LOCAL_MACOS: ${{ github.event_name == 'workflow_dispatch' && inputs.use_local_macos }}
        run: |
          set -euo pipefail
          test "$USE_LOCAL_MACOS" = "false" || { printf '%s\n' 'Local proof bypass is disabled; native Mac CI is required.' >&2; exit 1; }
          COMMIT="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse "$GITHUB_SHA^{commit}")" = "$COMMIT" || { printf '%s\n' 'Dispatch --ref must resolve to the release tag commit.' >&2; exit 1; }
          git checkout --detach "$COMMIT"
          python scripts/verify_release_assets.py identity --tag "$RELEASE_TAG" --release-commit "$COMMIT"
          printf 'tag=%s\ncommit=%s\nuse_local_macos=%s\n' "$RELEASE_TAG" "$COMMIT" "$USE_LOCAL_MACOS" >> "$GITHUB_OUTPUT"
      - name: Initialize draft only; leave an existing published release untouched
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          python scripts/verify_release_assets.py initialize \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --release-commit "$RELEASE_COMMIT" \
            --github-output "$GITHUB_OUTPUT"

  release-checks:
    needs: initialize
    if: needs.initialize.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json
      - name: Verify pinned Node/npm and official registry
        run: |
          test "$(node --version)" = "v22.22.0"
          test "$(npm --version)" = "10.9.4"
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('dashboard-web/package-lock.json').read_text())
          for package in lock['packages'].values():
              resolved = package.get('resolved', '')
              if resolved and not resolved.startswith('https://registry.npmjs.org/'):
                  raise SystemExit('Non-official registry in package-lock.json')
          PY
      - run: python -m pip install -r requirements-dev.txt
      - name: Full Python suite (pytest and unittest cases)
        run: python -m pytest -vv -o faulthandler_timeout=120 tests
      - run: npm --prefix dashboard-web ci --no-audit --no-fund
      - run: npm --prefix dashboard-web run test
      - run: npm --prefix dashboard-web run lint
      - run: npm --prefix dashboard-web run build
      - run: python scripts/check_licenses.py
      - run: node scripts/check_licenses.mjs
      - run: python scripts/scan_secrets.py
      - name: Redacted history secrets gate
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source=/repo --redact --no-banner

  windows-preflight:
    # Fast, packaging-free Windows signal so encoding, locking or read-only
    # fixture regressions fail in minutes instead of after a full build.
    needs: initialize
    if: needs.initialize.outputs.eligible == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Preserve exact recipe bytes across Windows and Mac checkouts
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-windows.txt
      - name: Install test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-windows.txt
      - name: Full Windows tests without packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pytest -vv -o faulthandler_timeout=120 tests

  windows-release:
    needs: [initialize, windows-preflight]
    if: needs.initialize.outputs.eligible == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.initialize.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.initialize.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preserve exact recipe bytes across Windows and Mac checkouts
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json
      - name: Verify version and toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          if ((node --version) -ne "v22.22.0") { throw "Node version mismatch" }
          if ((npm --version) -ne "10.9.4") { throw "npm version mismatch" }
          python scripts/verify_release_assets.py identity --tag $env:RELEASE_TAG --release-commit $env:RELEASE_COMMIT
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make
      - name: Export the actual setup-msys2 Bash path to the native builder
        shell: msys2 {0}
        run: |
          printf 'SJTU_MSYS2_BASH=%s\n' "$(cygpath -w /usr/bin/bash.exe)" >> "$GITHUB_ENV"
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build self-contained Windows app, portable ZIP and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Test-Path -LiteralPath $env:SJTU_MSYS2_BASH)) { throw "setup-msys2 Bash not found" }
          ./scripts/build_windows_app.ps1
      - name: Verify frozen MCP discovery and UTF-8 call without web requests
        run: .venv/Scripts/python.exe scripts/check_packaged_mcp.py --bundle "dist/SJTU Learning Assistant"
      # The identical full suite already ran on this same immutable commit in
      # windows-preflight; do not duplicate a ~10 minute run after packaging.
      - name: Execute native evidence gates and produce all checksum sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & .venv/Scripts/python.exe scripts/prepare_release_evidence.py --platform windows `
            --tag $env:RELEASE_TAG --release-commit $env:RELEASE_COMMIT `
            --bundle "dist/SJTU Learning Assistant" --stage dist/ffmpeg `
            --artifacts-dir dist --output-dir dist/release-evidence
      - name: Preserve native Windows proof internally in this Release run
        uses: actions/upload-artifact@v4
        with:
          name: SJTU-release-evidence-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release-evidence/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload only Setup EXE and portable ZIP to DRAFT
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          & .venv/Scripts/python.exe scripts/verify_release_assets.py upload `
            --repo $env:GITHUB_REPOSITORY --tag $env:RELEASE_TAG --release-commit $env:RELEASE_COMMIT `
            --assets-dir dist/release-evidence

  macos-release:
    needs: initialize
    # Both native jobs build the exact resolved tag commit; local proofs cannot substitute.
    if: needs.initialize.outputs.eligible == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.initialize.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.initialize.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json
      - name: Validate exact tag and Node/npm
        run: |
          test "$(node --version)" = "v22.22.0"
          test "$(npm --version)" = "10.9.4"
          python scripts/verify_release_assets.py identity --tag "$RELEASE_TAG" --release-commit "$RELEASE_COMMIT"
      - name: Build and natively verify app and DMG
        run: |
          scripts/build_macos_app.sh
          .venv/bin/python -m pytest -vv -o faulthandler_timeout=120 tests
          .venv/bin/python scripts/check_packaged_mcp.py --bundle "dist/SJTU Learning Assistant.app"
          scripts/build_macos_dmg.sh
          .venv/bin/python scripts/prepare_release_evidence.py --platform macos \
            --tag "$RELEASE_TAG" --release-commit "$RELEASE_COMMIT" \
            --bundle "dist/SJTU Learning Assistant.app" --stage dist/ffmpeg \
            --artifacts-dir dist --output-dir dist/release-evidence
      - name: Preserve native Mac proof internally in this Release run
        uses: actions/upload-artifact@v4
        with:
          name: SJTU-release-evidence-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release-evidence/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload only the native DMG to DRAFT
        run: |
          .venv/bin/python scripts/verify_release_assets.py upload \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --release-commit "$RELEASE_COMMIT" \
            --assets-dir dist/release-evidence

  publish-release:
    needs: [initialize, release-checks, windows-release, macos-release]
    # No skipped, failed or local-only native build is eligible for promotion.
    if: >-
      always() &&
      needs.initialize.result == 'success' && needs.initialize.outputs.eligible == 'true' &&
      needs.release-checks.result == 'success' && needs.windows-release.result == 'success' &&
      needs.macos-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.initialize.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Authenticate same-run native proof, verify all three downloaded binaries, then promote
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.initialize.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.initialize.outputs.commit }}
          # Pin authenticated workflow context; never trust an actor claimed by proof JSON.
          RELEASE_ACTOR: ${{ github.actor }}
        run: |
          python scripts/verify_release_assets.py publish \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --release-commit "$RELEASE_COMMIT" \
            --release-run "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --actor "$RELEASE_ACTOR" \
            --assets-dir dist/release-download
